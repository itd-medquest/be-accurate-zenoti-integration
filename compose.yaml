services:
  mysql:
    image: mysql:8.4.13
    environment:
      MYSQL_DATABASE: intgrte
      MYSQL_USER: intgrte
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in your private environment}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in your private environment}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_bin
      - --default-time-zone=+00:00
    ports:
      - '127.0.0.1:3306:3306'
    volumes:
      - intgrte_mysql:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h 127.0.0.1 -u root --silent',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
volumes:
  intgrte_mysql:
