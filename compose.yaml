services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: imp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-imp_local}
      POSTGRES_DB: imp
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - imp_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U imp -d imp']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  imp_postgres:
